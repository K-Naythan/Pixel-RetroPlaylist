<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="janela-windows">
        <h2>Minha Playlist Retro</h2>
        
        <video id="player-mp4" controls width="100%"></video>

        <div class="importar-container">
            <label for="importar-arquivo" class="botao-retro">Adicionar MP3 / MP4</label>
            <input type="file" id="importar-arquivo" accept="video/mp4, audio/mp3" multiple style="display: none;">
        </div>

        <ul id="lista-playlist"></ul>
    </div>

    <div class="janela-windows" style="margin-top: 15px;">
        <h2>Conectar Playlist</h2>
        <div class="sala-controles">
            <button id="btn-criar-sala" class="botao-retro">Criar Código</button>
            <p>Seu Código: <strong id="codigo-gerado">-</strong></p>
            <hr>
            <input type="text" id="input-codigo-convite" placeholder="Colar código aqui...">
            <button id="btn-entrar-sala" class="botao-retro">Entrar na Playlist</button>
        </div>
    </div>

    <div class="janela-windows" style="margin-top: 15px;">
        <h2>Chat da Playlist</h2>
        <div id="caixa-chat"></div>
        <div class="chat-input-container">
            <input type="text" id="input-mensagem" placeholder="Digite uma mensagem...">
            <button id="btn-enviar-mensagem" class="botao-retro">Enviar</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
    </html>
