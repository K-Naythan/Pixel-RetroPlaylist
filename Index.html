
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="janela-windows">
        <h2>Minha Playlist Retro</h2>
        
        <video id="player-mp4" controls width="100%"></video>

        <div class="importar-container">
            <label for="importar-arquivo" class="botao-retro">Adicionar MP4</label>
            <input type="file" id="importar-arquivo" accept="video/mp4" multiple style="display: none;">
        </div>

        <ul id="lista-playlist">
            </ul>
    </div>

    <script href="script.js"></script>
</body>
              </html>
